name: Android CI

on:
  push:
    branches: ["main", "fix/build-errors"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check storefront JavaScript syntax
        run: node --check website/config.js && node --check website/app.js
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK signing schemes
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: strict-blocker-installable-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
