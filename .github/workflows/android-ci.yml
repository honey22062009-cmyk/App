name: Android CI

on:
  push:
    branches: ["main", "fix/build-errors", "redesign/unslop-native-ui", "feature/habit-tracker-redesign"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check storefront JavaScript syntax
        run: node --check website/config.js && node --check website/app.js
      - name: Configure optional retained Android signing key
        id: signing
        env:
          ANDROID_SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_SIGNING_BUNDLE_BASE64" ]; then
            BUNDLE_DIR="$RUNNER_TEMP/strict-blocker-signing"
            mkdir -p "$BUNDLE_DIR"
            printf '%s' "$ANDROID_SIGNING_BUNDLE_BASE64" | base64 --decode > "$RUNNER_TEMP/strict-blocker-signing.zip"
            unzip -q "$RUNNER_TEMP/strict-blocker-signing.zip" -d "$BUNDLE_DIR"
            PROPERTIES_FILE="$BUNDLE_DIR/signing.properties"
            KEYSTORE_FILE="$BUNDLE_DIR/$(sed -n 's/^KEYSTORE_FILE=//p' "$PROPERTIES_FILE")"
            STORE_PASSWORD="$(sed -n 's/^STORE_PASSWORD=//p' "$PROPERTIES_FILE")"
            KEY_PASSWORD="$(sed -n 's/^KEY_PASSWORD=//p' "$PROPERTIES_FILE")"
            KEY_ALIAS="$(sed -n 's/^KEY_ALIAS=//p' "$PROPERTIES_FILE")"
            test -f "$KEYSTORE_FILE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
            chmod 600 "$KEYSTORE_FILE" "$PROPERTIES_FILE"
            echo "::add-mask::$STORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/strict-blocker-signing.zip"
          elif [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/strict-blocker-update-key.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${ANDROID_KEY_ALIAS:-upload}" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No retained signing key configured. The release APK will not be published; use the installable debug APK for device testing."
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: Verify release APK identity and signature
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner" && test -x "$aapt"
          "$apksigner" verify --verbose --print-certs "$apk"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.aistudio.strictblocker.kzvwpq' versionCode='12' versionName='2.1.0'"
      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: strict-blocker-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify debug APK signature
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: strict-blocker-installable-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
