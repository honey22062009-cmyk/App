name: Android CI

on:
  push:
    branches: ["main", "fix/build-errors", "ui/polish-v1-3"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Configure optional Google Sign-In
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID" > .env
          else
            printf 'GOOGLE_WEB_CLIENT_ID=CHANGE_ME\n' > .env
            echo "::warning::Google Sign-In is not configured yet. Firebase manual payments still build and work."
          fi
      - name: Check storefront JavaScript syntax
        run: node --check website/config.js && node --check website/app.js
      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: strict-blocker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
