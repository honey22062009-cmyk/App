name: Android CI

on:
  push:
    branches: ["main", "fix/build-errors", "ui/polish-v1-3", "enhance/**"]
  pull_request:
    branches: ["main", "ui/polish-v1-3"]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Configure optional Google Sign-In
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID" > .env
          else
            printf 'GOOGLE_WEB_CLIENT_ID=CHANGE_ME\n' > .env
            echo "::warning::Google Sign-In is not configured yet. Core offline features remain available."
          fi
      - name: Check storefront JavaScript syntax
        run: node --check website/config.js && node --check website/app.js
      - name: Configure optional retained Android signing key
        id: signing
        env:
          ANDROID_SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_SIGNING_BUNDLE_BASE64" ]; then
            BUNDLE_DIR="$RUNNER_TEMP/no-goon-signing"
            mkdir -p "$BUNDLE_DIR"
            printf '%s' "$ANDROID_SIGNING_BUNDLE_BASE64" | base64 --decode > "$RUNNER_TEMP/no-goon-signing.zip"
            unzip -q "$RUNNER_TEMP/no-goon-signing.zip" -d "$BUNDLE_DIR"
            PROPERTIES_FILE="$BUNDLE_DIR/signing.properties"
            KEYSTORE_FILE="$BUNDLE_DIR/$(sed -n 's/^KEYSTORE_FILE=//p' "$PROPERTIES_FILE")"
            STORE_PASSWORD="$(sed -n 's/^STORE_PASSWORD=//p' "$PROPERTIES_FILE")"
            KEY_PASSWORD="$(sed -n 's/^KEY_PASSWORD=//p' "$PROPERTIES_FILE")"
            KEY_ALIAS="$(sed -n 's/^KEY_ALIAS=//p' "$PROPERTIES_FILE")"
            test -f "$KEYSTORE_FILE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
            chmod 600 "$KEYSTORE_FILE" "$PROPERTIES_FILE"
            echo "::add-mask::$STORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/no-goon-signing.zip"
          elif [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/strict-blocker-update-key.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${ANDROID_KEY_ALIAS:-upload}" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No retained Android signing key configured. Add the repository secret ANDROID_SIGNING_BUNDLE_BASE64 to publish stable update APKs."
          fi
      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Build update APK with retained signing key
        if: steps.signing.outputs.configured == 'true'
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: Verify update APK identity and signature
        if: steps.signing.outputs.configured == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.aistudio.strictblocker.kzvwpq' versionCode='10' versionName='1.8.0'"
      - name: Upload signed update APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: no-goon-1.8.0-signed-update-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build release bundle
        if: steps.signing.outputs.configured == 'true'
        run: gradle :app:bundleRelease --stacktrace --no-daemon
      - name: Upload release bundle
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: no-goon-1.8.0-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*

  tablet-ui:
    name: UI · ${{ matrix.device }} · API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: tablet
            api: 35
            profile: pixel_c
          - device: phone
            api: 36
            profile: pixel_6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Run Android UI regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/run-tablet-ui.sh
      - name: Upload tablet UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-evidence-${{ matrix.device }}
          path: |
            tablet-ui-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
